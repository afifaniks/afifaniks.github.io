# If a book has no cover on file, a typographic tile is shown instead.
#   isbn   : ISBN-13 or ISBN-10 (drives the cover). optional but recommended.
#   cover  : optional direct image URL to override the auto cover.
#   url    : optional link (Goodreads / StoryGraph / publisher).
