# Movies ---------------------------------------------------------------------
# Paste a poster image URL in `poster:`. A convenient stable source is TMDB's
# image CDN — find a film on themoviedb.org, right-click its poster, and use
# the https://image.tmdb.org/t/p/w500/<id>.jpg link (no API key needed just to
# display it). A local path (/assets/img/...) works too. If `poster:` is
# omitted, a clean typographic title tile is shown instead.
#   url : optional link (Letterboxd / IMDb).
# movies:
#   - title: "Interstellar"
#     year: 2014
#     director: "Christopher Nolan"
#     poster: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg"
#     note: "Love, relativity, and a corn field. Somehow it works."
#   - title: "The Social Network"
#     year: 2010
#     director: "David Fincher"
#     poster: "https://image.tmdb.org/t/p/w500/n0ybibhJtQ5icDqTp8eRytcIHJx.jpg"
#     note: "The most quotable script about building software."
#   - title: "Whiplash"
#     year: 2014
#     director: "Damien Chazelle"
#     poster: "https://image.tmdb.org/t/p/w500/7fn624j5lj3xTme2SgiLCeuedmO.jpg"
#     note: "On the thin line between drive and obsession."

